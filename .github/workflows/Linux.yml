name: Linux (gcc with EDK2)

on:
  workflow_dispatch:
    branches: [main]
  push:
    branches: [main]
    tags:
      - '**'
  pull_request:
    branches: [main]

env:
  BUILD_TYPE: RELEASE
  COMPILER: GCC
  GCC_ARM_PREFIX: arm-linux-gnueabi-
  GCC_AARCH64_PREFIX: aarch64-linux-gnu-
  GCC_RISCV64_PREFIX: riscv64-linux-gnu-
  GCC_LOONGARCH64_PREFIX: loongarch64-unknown-linux-gnu-
  EDK2_STABLE_TAG: edk2-stable202508.01
  LOONGARCH64_TOOLCHAIN_TAG: 2025.08.08
  LOONGARCH64_TOOLCHAIN_NAME: x86_64-cross-tools-loongarch64-binutils_2.45-gcc_15.1.0-glibc_2.42.tar.xz

jobs:
  Linux-EDK2-Build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        arch: [X64, IA32, ARM, AARCH64, RISCV64, LOONGARCH64]
        include:
        - arch: X64
          short: x64
          pkgs: gcc-multilib
        - arch: IA32
          short: ia32
          pkgs: gcc-multilib
        - arch: AARCH64
          short: aa64
          pkgs: gcc-aarch64-linux-gnu
        - arch: ARM
          short: arm
          pkgs: gcc-arm-linux-gnueabi
        - arch: RISCV64
          short: riscv64
          pkgs: gcc-riscv64-linux-gnu
        - arch: LOONGARCH64
          short: loongarch64
          pkgs: gcc-multilib

    steps:
    - name: Check out repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set version
      id: set_version
      run: echo "version=$(git describe --tags)" >> $GITHUB_OUTPUT

    - name: Set up Linux environment
      run: |
        sudo apt-get update
        sudo apt-get -y --no-install-recommends install python3-setuptools nasm uuid-dev ${{ matrix.pkgs }}
        if [[ "${{ matrix.arch }}" == "LOONGARCH64" ]]; then
          curl -L -O https://github.com/loongson/build-tools/releases/download/${LOONGARCH64_TOOLCHAIN_TAG}/${LOONGARCH64_TOOLCHAIN_NAME}
          tar -xJf ${LOONGARCH64_TOOLCHAIN_NAME}
          echo "$PWD/cross-tools/bin" >> "$GITHUB_PATH"
        fi

    - name: Set up EDK2
      run: |
        git clone --branch ${EDK2_STABLE_TAG} --recursive https://github.com/tianocore/edk2.git
        make -C edk2/BaseTools

    - name: Build UEFI bootloader
      run: |
        export WORKSPACE=$PWD
        export PACKAGES_PATH=$WORKSPACE:$WORKSPACE/edk2
        source edk2/edksetup.sh
        build -a ${{ matrix.arch }} -b ${{ env.BUILD_TYPE }} -t ${{ env.COMPILER }} -p Md5SumPkg.dsc
        mv Build/${{ env.BUILD_TYPE }}_${{ env.COMPILER }}/${{ matrix.arch }}/Md5Sum.efi boot${{ matrix.short }}.efi

    - name: Display SHA-256
      run: sha256sum *.efi

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.short }}
        path: ./*.efi

    - name: Create release
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        body: "**UEFI md5sum ${{ steps.set_version.outputs.version }}**"
        files: ./*.efi
